<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2520" viewBox="0 0 1500 1260" role="img" aria-labelledby="title desc"><title id="title">Donald Microduck hardware at a glance</title><desc id="desc">Four ReSpeaker microphones feed an XVF3800 DSP and XIAO ESP32-S3 bridge. USB audio and CDC connect the bridge to a Radxa ZERO 3W. A camera, Robot HAT with BMI088 motion sensing, fifteen XL330 servos, speaker, mechanical assembly and removable NP-F battery complete the functional overview. Dashed paths need physical or application integration. The supplied audio firmware carries two processed channels at 16 kHz.</desc><defs>
